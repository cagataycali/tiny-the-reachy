{# Original vector illustration, drawn for this documentation. No hardware or model asset. #}
{% macro companion(key='home', interactive=true) %}
<figure class="rh-companion" data-pose="curious" aria-labelledby="{{ key }}-companion-caption">
  <div class="rh-companion__drawing">
    <svg viewBox="0 0 400 360" role="img" aria-labelledby="{{ key }}-robot-title {{ key }}-robot-desc">
      <title id="{{ key }}-robot-title">TINY, a little desktop companion</title>
      <desc id="{{ key }}-robot-desc">An original illustration of a cream Reachy Mini with two dark eyes, a rounded body and two expressive antenna ears. Not a camera feed or a physical simulation.</desc>
      <circle class="rh-orbit" cx="200" cy="166" r="137"/>
      <path class="rh-desk" d="M30 319H370"/>
      <ellipse class="rh-shadow" cx="202" cy="316" rx="103" ry="15"/>
      <path class="rh-body" d="M151 231C142 243 124 272 120 294Q119 312 199 316Q280 312 280 294C276 272 258 243 249 231Z"/>
      <ellipse class="rh-body-top" cx="200" cy="237" rx="49" ry="17"/>
      <path class="rh-neck" d="M177 235L166 203M192 241L185 205M208 241L215 205M224 235L236 203"/>
      <g class="rh-robot-head">
        <g class="rh-ear rh-ear--left"><path class="rh-ear-stem" d="M127 135L103 66"/><rect class="rh-ear-tip" x="94" y="46" width="19" height="46" rx="9" transform="rotate(-17 104 69)"/></g>
        <g class="rh-ear rh-ear--right"><path class="rh-ear-stem" d="M273 135L294 62"/><rect class="rh-ear-tip" x="285" y="42" width="19" height="46" rx="9" transform="rotate(17 295 65)"/></g>
        <path class="rh-head-shell" d="M89 141C92 103 129 97 200 97S308 103 311 141L307 192C303 219 266 230 200 230S97 219 93 192Z"/>
        <path class="rh-head-highlight" d="M112 133C123 113 160 111 194 111"/>
        <ellipse class="rh-eye-rim" cx="151" cy="165" rx="37" ry="40"/>
        <ellipse class="rh-eye-rim" cx="249" cy="165" rx="37" ry="40"/>
        <ellipse class="rh-eye" cx="151" cy="165" rx="27" ry="31"/>
        <ellipse class="rh-eye" cx="249" cy="165" rx="27" ry="31"/>
        <ellipse class="rh-glint" cx="144" cy="154" rx="8" ry="10"/>
        <ellipse class="rh-glint" cx="242" cy="154" rx="8" ry="10"/>
        <circle class="rh-camera" cx="200" cy="187" r="5"/>
        <path class="rh-cheek" d="M113 202L126 205M274 205L287 202"/>
      </g>
      <g class="rh-spark" aria-hidden="true"><path d="M336 126V144M327 135H345M63 214V226M57 220H69"/></g>
    </svg>
  </div>
  <figcaption id="{{ key }}-companion-caption">Illustration · <strong>not live</strong></figcaption>
  {% if interactive %}
  <div class="rh-pose-controls" role="group" aria-label="Explore illustrated expressions" hidden>
    <button type="button" data-pose-choice="curious" aria-pressed="true">Curious</button>
    <button type="button" data-pose-choice="listening" aria-pressed="false">Listening</button>
    <button type="button" data-pose-choice="resting" aria-pressed="false">Resting</button>
  </div>
  <div class="rh-pose-note" aria-live="polite" aria-atomic="true">
    <code data-pose-code>reachy_look(roll=15)</code>
  </div>
  {% endif %}
</figure>
{% endmacro %}
