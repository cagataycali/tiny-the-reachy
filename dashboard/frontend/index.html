<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Scheme before paint: a stored choice (Settings) wins, else the OS. Material's docs do the same for the Strands site.
      (function () {
        var k = "reachy-scheme", s = null
        try { s = localStorage.getItem(k) } catch (e) {}
        var dark = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.setAttribute("data-scheme", dark ? "dark" : "paper")
        if (!s) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
          try { if (localStorage.getItem(k)) return } catch (err) {}
          document.documentElement.setAttribute("data-scheme", e.matches ? "dark" : "paper")
        })
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="reachy" />
    <meta name="description" content="tiny / reachy: the Reachy Mini cockpit. Sign in with a passkey." />
    <meta name="robots" content="noindex" />
    <title>tiny / reachy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
