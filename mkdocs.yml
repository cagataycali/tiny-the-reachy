site_name: tiny
site_url: https://cagataycali.github.io/tiny-the-reachy
site_description: "tiny · Strands agent for the Reachy Mini — expressive, conversational, on the desk."
site_author: Cagatay Cali
repo_url: https://github.com/cagataycali/tiny-the-reachy
repo_name: cagataycali/tiny-the-reachy
edit_uri: edit/main/docs/
copyright: "tiny · expression · language · presence — on the desk"

exclude_docs: |
  *.bak
  LIVE_DEPLOY.md
  hooks/
  scripts/README.md
  design-assets/README.md

extra_css:
  - stylesheets/reachy.css

extra_javascript:
  - js/docs/docs.js

nav:
  - Home: index.md
  - Get started:
      - Quickstart: start/quickstart.md
      - Systemd (how TINY boots): start/systemd.md
      - Deploying to the robot: start/robot.md
      - Docker (laptop + Lite): start/docker.md
  - Showcase:
      - Expression: showcase/expression.md
      - Personas: showcase/personas.md
      - Dashboard (twin PiP): DASHBOARD.md
      - Perception (tracking · DoA · pressure): PERCEPTION.md
  - Tools:
      - Catalog: tools/catalog.md
      - Motion: tools/motion.md
      - Expression: tools/expression.md
      - Sensing: tools/sensing.md
  - Guide:
      - Architecture: guide/architecture.md
      - Safety envelope: guide/safety.md
      - Cross-persona brain: guide/brain.md
      - Extending: guide/extending.md
      - Operations (incidents · budgets · before a demo): guide/operations.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference:
      - Tools:
          - reference/tools/index.md
          - Motion: reference/tools/reachy_motion.md
          - Expression: reference/tools/reachy_expression.md
          - State: reference/tools/reachy_state.md
          - Camera: reference/tools/reachy_camera.md
          - Audio: reference/tools/reachy_audio.md
          - Head tracking: reference/tools/head_tracking.md
          - Vision: reference/tools/vision.md
          - Voice bridge: reference/tools/voice_bridge.md
          - Dispatch: reference/tools/dispatch.md
          - Memory: reference/tools/memory.md
          - Telegram: reference/tools/telegram.md
          - Prompts: reference/tools/prompts.md
          - Manage messages: reference/tools/manage_messages.md
          - Manage tools: reference/tools/manage_tools.md
          - Fleet (use_device): reference/tools/tiny_mcp.md
      - Dashboard API: reference/api.md
      - Env vars: reference/env.md
      - Daemon API: reference/daemon.md
      - The family: reference/family.md

theme:
  name: material
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: switch to dark
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: switch to light
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
    - announce.dismiss

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ''
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.betterem
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: "·"

plugins:
  - search:
      lang: en

hooks:
  - docs/hooks/gen.py     # regenerates reference/tools/*, reference/env.md, reference/api.md from the code
  - docs/hooks/opener.py  # page opener (eyebrow · dek · chips) + the footer's build ledger

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cagataycali/tiny-the-reachy
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/cagataycali
  status:
    new: recently added
    deprecated: deprecated
