name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      # the reference pages are generated from these at build (docs/hooks/gen.py)
      - 'scripts/*.py'
      - 'tools/**.py'
      - 'dashboard/*.py'
      - 'tiny.py'
      - '*_listener.py'
      - 'thinker_loop.py'
      - 'prompts/**'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs deps
        run: pip install -r requirements-docs.txt

      - name: Docs drift tests (generated pages vs code)
        run: pip install pytest && pytest tests/test_docs.py -q

      - name: Build docs (strict)
        run: mkdocs build --clean --strict

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: mkdocs gh-deploy --force --no-history
